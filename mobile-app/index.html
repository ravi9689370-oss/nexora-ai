<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Nexora AI</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%234c1d95'/%3E%3Cpath fill='%23FBBF24' d='M44,14 L74,14 L58,45 L73,45 L39,95 L49,58 L34,58 Z'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <!-- Boot screen: replaced by the router once the store is ready -->
    <div class="boot-screen">
      <div class="boot-mark">
        <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#FBBF24" d="M44,14 L74,14 L58,45 L73,45 L39,95 L49,58 L34,58 Z" />
          <path fill="#FFFFFF" opacity="0.85" d="M24,26 L31,33 L24,40 L17,33 Z" />
          <path fill="#FFFFFF" opacity="0.85" d="M80,68 L85,73 L80,78 L75,73 Z" />
        </svg>
      </div>
      <p class="boot-title">Nexora AI</p>
      <p class="boot-sub">local workspace — loading…</p>
    </div>
  </div>

  <script>
    /* ES5-only compatibility layer for old Android WebViews (Chrome < 86). */
    (function () {
      if (window.Element && !Element.prototype.replaceChildren) {
        function rc() {
          while (this.firstChild) this.removeChild(this.firstChild);
          for (var i = 0; i < arguments.length; i++) {
            var n = arguments[i];
            if (n) this.appendChild(typeof n === "string" ? document.createTextNode(n) : n);
          }
        }
        Element.prototype.replaceChildren = rc;
        if (window.Document && !Document.prototype.replaceChildren) Document.prototype.replaceChildren = rc;
        if (window.DocumentFragment && !DocumentFragment.prototype.replaceChildren) DocumentFragment.prototype.replaceChildren = rc;
      }
      if (window.crypto && !crypto.randomUUID) {
        crypto.randomUUID = function () {
          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
            var r = (Math.random() * 16) | 0;
            return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
          });
        };
      }
    })();
  </script>
  <!-- Boot watchdog: if the shell never renders, show an actionable error
       instead of an eternal splash (also works when the bundle parse fails). -->
  <script>
    (function () {
      setTimeout(function () {
        if (document.getElementById("pageRoot")) return;
        var note = document.createElement("div");
        note.setAttribute("style", "margin:14px;padding:14px;border-radius:12px;background:#2e1065;color:#fff;font:14px/1.5 -apple-system,sans-serif");
        note.innerHTML = "<b>Init failed</b><br>See Settings &rarr; app compatibility, or reinstall. Tip: update <i>Android System WebView</i> from Play Store, then reopen Nexora AI.";
        var host = document.getElementById("app") || document.body;
        host.appendChild(note);
      }, 9000);
    })();
  </script>
  <script src="assets/js/bundle.js" defer></script>
</body>
</html>
